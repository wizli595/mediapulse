x-mediapulse-common: &mediapulse-common
  build: .
  env_file: .env
  depends_on:
    minio:
      condition: service_healthy
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy
  networks:
    - mediapulse

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__SECRET_KEY: mediapulse-secret-key
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - mediapulse

services:

  # ===========================================
  # Infrastructure
  # ===========================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - mediapulse
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - mediapulse
    volumes:
      - kafka-data:/var/lib/kafka/data

  minio:
    image: minio/minio:latest
    container_name: mediapulse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediapulse
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: mediapulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mediapulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./warehouse/init-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh
      - ./warehouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  # ===========================================
  # Application Services
  # ===========================================

  init-buckets:
    <<: *mediapulse-common
    command: python -m storage.setup_buckets
    restart: "no"

  batch-scraper:
    <<: *mediapulse-common
    command: python -m scripts.batch_scrape
    depends_on:
      init-buckets:
        condition: service_completed_successfully

  stream-consumer:
    <<: *mediapulse-common
    command: python -m scripts.consume_stream
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    restart: always

  bronze-to-silver:
    <<: *mediapulse-common
    command: python -m scripts.bronze_to_silver
    depends_on:
      init-buckets:
        condition: service_completed_successfully

  gold-aggregator:
    <<: *mediapulse-common
    command: python -m scripts.silver_to_gold
    depends_on:
      init-buckets:
        condition: service_completed_successfully

  warehouse-loader:
    <<: *mediapulse-common
    command: python -m scripts.gold_to_warehouse

  full-pipeline:
    <<: *mediapulse-common
    command: python -m scripts.run_full_pipeline
    depends_on:
      init-buckets:
        condition: service_completed_successfully

  # ===========================================
  # Orchestration (Airflow)
  # ===========================================

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@mediapulse.local || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ===========================================
  # Dashboard (React + FastAPI)
  # ===========================================

  dashboard-api:
    build:
      context: .
      dockerfile: dashboard/backend/Dockerfile
    container_name: mediapulse-dashboard-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mediapulse

  dashboard-ui:
    build: dashboard/frontend
    container_name: mediapulse-dashboard
    ports:
      - "3000:80"
    depends_on:
      - dashboard-api
    networks:
      - mediapulse

  # ===========================================
  # Visualization (Metabase - optional)
  # ===========================================

  metabase:
    image: metabase/metabase:latest
    container_name: mediapulse-metabase
    ports:
      - "3002:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mediapulse

  # ===========================================
  # Monitoring
  # ===========================================

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mediapulse

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - mediapulse

  prometheus:
    image: prom/prometheus:latest
    container_name: mediapulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - postgres-exporter
      - kafka-exporter
    networks:
      - mediapulse

  grafana:
    image: grafana/grafana:latest
    container_name: mediapulse-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - mediapulse

networks:
  mediapulse:
    driver: bridge

volumes:
  zookeeper-data:
  kafka-data:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:
